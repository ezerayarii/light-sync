# Copy this file to secrets.yaml (same folder) and fill it in. secrets.yaml is in .gitignore: never commit it.
# Then let only your account read it (File Explorer -> Properties -> Security, or icacls).

# Home Assistant long-lived access token (HA profile -> Security -> Long-lived access tokens)
ha_token: ""

# Password of the motionEye stream user (SNAP_USER in start_lights.bat)
snap_pass: ""

# Claude API key for daily_summary.py (optional: without it the summary is skipped)
anthropic_api_key: ""
