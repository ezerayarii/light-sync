    m.forEach((p,i)=>i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1]));g.closePath();g.fill();g.globalCompositeOperation='lighter';
    const c=P3(0,1.3,5.92);if(c){const fs=Math.max(8,.15*c[2]);g.textAlign='center';g.fillStyle='rgba(255,255,255,.85)';  // what is playing
      g.font=`800 ${fs}px system-ui,sans-serif`;g.fillText(online?(S.period&&S.bpm?`${S.bpm} BPM`:nowWord().toUpperCase()):'NOT RUNNING',c[0],c[1]-fs*.2);
      g.font=`500 ${fs*.6}px system-ui,sans-serif`;g.fillStyle='rgba(255,255,255,.6)';
      g.fillText(S.game?('game: '+S.game):(S.audio||'').replace(/^mic: /,''),c[0],c[1]+fs*.75);
      if(S.analysis&&online){g.fillStyle='rgba(255,255,255,.45)';g.fillText(`${S.analysis.section} · ${S.analysis.mood}`,c[0],c[1]+fs*1.45)}}}
  for(let i=0;i<n;i++){const q=path[i],p=P3(q[0],q[1],q[2]),b=chaseAt(i,n);if(p){g.fillStyle=rgba(mix(segs[i],[255,255,255],.35),.5+.5*la.screen);
    g.beginPath();g.arc(p[0],p[1],Math.max(1.5,.04*p[2]*(1+.8*b)),0,Math.PI*2);g.fill()}}
  const nb=LITE?32:48;
  for(let i=0;i<nb;i++){const k=Math.min(31,Math.floor(Math.abs(i-(nb-1)/2)/(nb/2)*32)),v=spec[k],a=i/nb*Math.PI*2+rot*.15;   // spectrum ring
    const x=Math.cos(a)*1.7,z=3.2+Math.sin(a)*1.4,c=mix(mix(lc.beat,lc.wash,(Math.cos(a)+1)/2),lc.screen,(Math.sin(a)+1)/2*.6);
    line3([x,0,z],[x,.04+1.15*v*(.55+.6*en),z],c,.3+.7*v,(1.5+2*high)*D)}
  for(let i=waves.length-1;i>=0;i--){const w=waves[i];w.r+=dt*(2.2+2*en)*P.rings;w.a*=Math.pow(.25,dt);  // beat rings on the floor
    ring3(0,3.2,w.r,w.c,w.a,w.w);if(w.a<.03||w.r>5)waves.splice(i,1)}
  if(!LITE)lampGlows();
  for(let i=motes.length-1;i>=0;i--){const q=motes[i];q.x+=q.vx*dt;q.y+=q.vy*dt;q.z+=q.vz*dt;q.vy-=dt*.6;q.l-=dt*.55;   // sparks
    if(q.l<=0||q.y<0){motes.splice(i,1);continue}const p=P3(q.x,q.y,q.z);if(p){g.fillStyle=rgba(q.c,q.l);g.beginPath();g.arc(p[0],p[1],Math.max(1,.025*p[2]*(.5+q.l)),0,Math.PI*2);g.fill()}}
}
// ---- Heart: the app's heart, full screen, in the lights' real colours
function drawHeartStyle(P,dt,tNow){
  lightsNow(dt);
  const M=Math.min(W,H),cx=W/2,cy=H/2,calm=!!S.comfort,Rr=M*.22*(1+(calm?.05:.1)*pulse+.05*bass),n=segs.length,main=brightest();
  g.globalCompositeOperation='lighter';g.lineCap='round';
  let gr=g.createRadialGradient(cx,cy,Rr*.7,cx,cy,Math.max(W,H)*.6);gr.addColorStop(0,rgba(main,.03+.07*en+.07*pulse+.04*la.beat));gr.addColorStop(1,rgba(main,0));g.fillStyle=gr;g.fillRect(0,0,W,H);
  for(let i=rings.length-1;i>=0;i--){const r=rings[i];r.r+=dt*M*(.5+.5*en)*P.rings;r.a*=Math.pow(.2,dt);
    g.strokeStyle=rgba(r.c,r.a);g.lineWidth=r.w;g.beginPath();g.arc(cx,cy,r.r,0,Math.PI*2);g.stroke();if(r.a<.02||r.r>M)rings.splice(i,1)}
  const nb=LITE?64:96;
  for(let i=0;i<nb;i++){const h=i<nb/2?i:nb-1-i,k=Math.min(31,Math.floor(h/(nb/2)*32)),v=Math.min(1,spec[k]),a=rot+i/nb*Math.PI*2,r0=Rr*1.26,len=M*(.008+.19*v*(.55+.6*en));
    g.strokeStyle=rgba(mix(segs[Math.floor(i/nb*n)]||main,main,.25),.25+.75*v);g.lineWidth=(2+2*high)*D;g.beginPath();g.moveTo(cx+Math.cos(a)*r0,cy+Math.sin(a)*r0);g.lineTo(cx+Math.cos(a)*(r0+len),cy+Math.sin(a)*(r0+len));g.stroke()}
  for(let i=0;i<n;i++){const a0=-Math.PI/2+i/n*Math.PI*2+.05,a1=-Math.PI/2+(i+1)/n*Math.PI*2-.05;
    g.strokeStyle=rgba(segs[i],.4+.6*la.screen+.3*chaseAt(i,n));g.lineWidth=(6+4*chaseAt(i,n))*D;g.beginPath();g.arc(cx,cy,Rr*1.12,a0,a1);g.stroke()}
  [['beat',0],['wash',Math.PI]].forEach(([k,o])=>{const a=rot*.6+o,r=Rr*1.25+M*.13,x=cx+Math.cos(a)*r,y=cy+Math.sin(a)*r,s=M*(.03+.05*la[k])*(1+.3*pulse);
    const q=g.createRadialGradient(x,y,0,x,y,s);q.addColorStop(0,rgba(mix(lc[k],[255,255,255],.3),.25+.75*la[k]));q.addColorStop(1,rgba(lc[k],0));g.fillStyle=q;g.fillRect(x-s,y-s,2*s,2*s)});
  g.globalCompositeOperation='source-over';
  gr=g.createRadialGradient(cx,cy,Rr*.45,cx,cy,Rr);gr.addColorStop(0,'rgba(8,6,18,.94)');gr.addColorStop(.72,'rgba(8,6,18,.85)');gr.addColorStop(1,rgba(main,.3+.3*pulse));
  g.fillStyle=gr;g.beginPath();g.arc(cx,cy,Rr,0,Math.PI*2);g.fill();
  const fs=Rr*(S.period?.62:.2);g.textAlign='center';g.textBaseline='middle';g.fillStyle='#fff';g.font=`900 ${fs}px system-ui,sans-serif`;
  g.fillText(!online?'NOT RUNNING':S.period&&S.bpm?S.bpm:nowWord().toUpperCase(),cx,cy);g.textBaseline='alphabetic';
}
function drawClassic(P,dt,tNow){
  g.globalCompositeOperation='lighter';
  const cx=W/2,cy=H/2,M=Math.min(W,H);
  let gr=g.createRadialGradient(cx,cy,0,cx,cy,M*.75);                      // bass bloom
  gr.addColorStop(0,rgba(pal[2],.03+.10*bass+.08*pulse));gr.addColorStop(1,rgba(pal[2],0));g.fillStyle=gr;g.fillRect(0,0,W,H);
  for(let i=0;i<4&&P.beams>0;i++){                                          // stage beams
    const x=W*(.14+.24*i),ang=-Math.PI/2+Math.sin(tNow/1000*(.35+.5*build)+i*1.7)*.55,len=H*1.25,wd=(.04+.06*en+.05*pulse)*P.beams,c=i%2?pal[0]:pal[1];
    g.beginPath();g.moveTo(x,H);g.lineTo(x+Math.cos(ang-wd)*len,H+Math.sin(ang-wd)*len);g.lineTo(x+Math.cos(ang+wd)*len,H+Math.sin(ang+wd)*len);g.closePath();
    const lg=g.createLinearGradient(x,H,x+Math.cos(ang)*len,H+Math.sin(ang)*len);
    lg.addColorStop(0,rgba(c,(.03+.09*en+.08*pulse)*Math.min(1,P.beams)));lg.addColorStop(1,rgba(c,0));g.fillStyle=lg;g.fill()}
  for(let i=rings.length-1;i>=0;i--){const r=rings[i];r.r+=dt*M*(.55+.6*en)*P.rings;r.a*=Math.pow(.15,dt);   // shockwaves
    g.strokeStyle=rgba(r.c,r.a);g.lineWidth=r.w;g.beginPath();g.arc(cx,cy,r.r,0,Math.PI*2);g.stroke();if(r.a<.02||r.r>M)rings.splice(i,1)}
  const R=M*(.17+.05*bass+.06*pulse);g.lineCap='round';                     // spectrum ring
  for(let i=0;i<64;i++){const k=i<32?i:63-i,v=spec[k],a=rot+i/64*Math.PI*2,len=M*(.015+.22*v*(.6+.6*en));
    g.strokeStyle=rgba(mix(pal[0],pal[1],k/31),.35+.65*v);g.lineWidth=(2+3*high)*D;
    g.beginPath();g.moveTo(cx+Math.cos(a)*R,cy+Math.sin(a)*R);g.lineTo(cx+Math.cos(a)*(R+len),cy+Math.sin(a)*(R+len));g.stroke()}
  gr=g.createRadialGradient(cx,cy,0,cx,cy,R*.95);                           // core
  gr.addColorStop(0,rgba(mix(pal[0],[255,255,255],.35*pulse),.55+.4*pulse));gr.addColorStop(.6,rgba(pal[0],.18+.3*bass));gr.addColorStop(1,rgba(pal[0],0));
  g.fillStyle=gr;g.beginPath();g.arc(cx,cy,R*.95,0,Math.PI*2);g.fill();
}
let tPrev=performance.now(),hudHtml='';
function frame(tNow){
  if(LITE&&tNow-tPrev<1000/TARGET-4){requestAnimationFrame(frame);return}   // TV box: every other screen refresh, evenly
  const dtr=Math.max(0,(tNow-tPrev)/1000),dt=Math.min(.05,dtr);tPrev=tNow;   // dt for motion, dtr (real time) for fades
  frames++;
  if(tNow-fpsT>=1000){fpsAvg=frames*1000/(tNow-fpsT);frames=0;fpsT=tNow;   // slow screen (TV box): drop resolution until smooth
    if(fpsAvg<TARGET*.67){slowFor++;fastFor=0}else if(fpsAvg>TARGET*.95){fastFor++;slowFor=0}else{slowFor=fastFor=0}
    if(slowFor>=3&&scale>.5){scale-=.25;slowFor=0;size()}else if(fastFor>=10&&scale<1){scale+=.25;fastFor=0;size()}
    else if(slowFor>=3&&!LITE){LITE=true;CAP=960;TARGET=30;scale=1;slowFor=0;size()}}   // still slow at half size: the light profile
  const now=Date.now()/1000+skew+offset/1000;   // Light Sync's clock, shifted by the sync offset
  const P=STY[style]||STY.club, active=online&&S.running&&S.mode!=='paused'&&S.mode!=='standby', b=S.bands||[0,0,0];
  bass=lerp(bass,active?b[0]:0,.35);mid=lerp(mid,active?b[1]:0,.25);high=lerp(high,active?b[2]:0,.3);
  en=lerp(en,active?S.energy:0,.2);eShort=lerp(eShort,en,dt*1.2);eLong=lerp(eLong,en,dt*.15);
  build=lerp(build,Math.max(0,Math.min(1,(eShort-eLong)*5+high*.25-.1)),dt*1.5);
  const src=(S.palette&&S.palette.some(c=>c[0]+c[1]+c[2]>60))?S.palette:NEON,calm=!!S.comfort;
  for(let i=0;i<3;i++)pal[i]=mix(pal[i],calm?soften(src[i],S.night):src[i],Math.min(1,dt*(calm?1:3)));
  const sp=S.spectrum||[];for(let i=0;i<32;i++)spec[i]=lerp(spec[i],active?(sp[i]||0):0,.4);
  // beats: on the predicted beat once the tempo is steady, otherwise on each detected beat
  if(active&&S.period){const k=Math.floor((now-S.last_beat)/S.period),bt=S.last_beat+k*S.period;
    if(bt>nextPulse&&now-bt<.15){nextPulse=bt;beatHit(en,false)}}
  else if(active&&S.last_beat>lastBeatSeen){lastBeatSeen=S.last_beat;if(now-S.last_beat<.3)beatHit(en,false)}
  if(S.big_at>lastBigSeen){lastBigSeen=S.big_at;if(active)beatHit(1,true)}
  pulse*=Math.pow(.02,dtr);chase=Math.min(9,chase+dtr/.38);rot+=dt*(.08+.9*build+.25*mid);
  g.globalCompositeOperation='source-over';g.fillStyle=`rgba(0,0,0,${P.trail+.25*(1-en)})`;g.fillRect(0,0,W,H);
  g.save();
  if(style==='room')drawRoom(P,dt,tNow);else if(style==='heart')drawHeartStyle(P,dt,tNow);else if(style==='neon')drawNeon(P,dt,tNow,now);else drawClassic(P,dt,tNow);
  g.globalCompositeOperation='lighter';
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.x+=p.vx;p.y+=p.vy;p.vy+=p.gr;p.vx*=.975;p.vy*=.975;p.l-=dt*(.6+.4*(1-en));   // particles
    if(p.l<=0){parts.splice(i,1);continue}g.fillStyle=rgba(p.c,p.l);g.beginPath();g.arc(p.x,p.y,p.z*(.6+p.l),0,Math.PI*2);g.fill()}
  const sparks=style==='room'||style==='heart'?0:Math.floor(high*high*25*P.parts),top=style==='neon'?horizon():H;   // hi-hat sparkle (in the sky for neon)
  for(let i=0;i<sparks;i++){g.fillStyle=rgba(mix(pal[1],[255,255,255],.6),.3+.6*Math.random());const s=(1+Math.random()*2)*D;g.fillRect(Math.random()*W,Math.random()*top,s,s)}
  g.restore();
  const barOn=performance.now()<barUntil;bar.style.opacity=barOn?1:0;bar.style.pointerEvents=barOn?'auto':'none';
  const show=hudOn&&performance.now()<hudUntil;hud.style.opacity=show?1:0;
  if(show){const m=online?(S.mode||'paused'):'offline',cls=m==='party'?'':m==='ambient'||m==='gaming'?' cyan':' dim';
    const html=`<div class="row"><span class="logo">LIGHT SYNC</span><span class="pill${cls}">${online?m:'not running'}</span>`+
      (online&&S.period&&S.bpm?`<span class="pill dim">${S.bpm} BPM</span>`:'')+`</div>`+
      (HAS_KEYS?`<div class="keys"><kbd>F</kbd> full screen · <kbd>1</kbd>-<kbd>6</kbd> styles · <kbd>←</kbd><kbd>→</kbd> sync ${offset>0?'+':''}${offset} ms · <kbd>H</kbd> hide · ${fpsAvg|0} fps</div>`:'');
    if(html!==hudHtml){hud.innerHTML=html;hudHtml=html}}
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
addEventListener('keydown',e=>{
  if(e.key==='f'||e.key==='F'||e.key==='Enter'){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}
  else if(e.key==='ArrowUp'||e.key==='ArrowDown'){setStyle(STYLES[(STYLES.indexOf(style)+(e.key==='ArrowDown'?1:STYLES.length-1))%STYLES.length]);e.preventDefault()}
  else if(e.key==='ArrowLeft'||e.key==='ArrowRight'){offset+=e.key==='ArrowRight'?10:-10;put('ls_offset',offset)}
  else if('123456'.includes(e.key)&&e.key.length===1)setStyle(STYLES[+e.key-1]);
  else if(e.key==='h'||e.key==='H'){hudOn=!hudOn;put('ls_hud',hudOn?'1':'0');buildBar()}
  hudUntil=performance.now()+6000});
addEventListener('mousemove',()=>{hudUntil=performance.now()+4000;barUntil=performance.now()+4000});
// the touch controls: styles, and the text on or off. A tap brings them back; a TV box without a mouse never sees them
function setStyle(s){style=s;put('ls_style3',s);waves.length=0;motes.length=0;rings.length=0;parts.length=0;buildBar()}
function buildBar(){bar.innerHTML=STYLES.map(s=>`<button data-s="${s}" class="${s===style?'on':''}">${s}</button>`).join('')+`<button data-hud="1">${hudOn?'hide text':'show text'}</button>`}
bar.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;barUntil=performance.now()+6000;
  if(b.dataset.s)setStyle(b.dataset.s);else{hudOn=!hudOn;put('ls_hud',hudOn?'1':'0');hudUntil=performance.now()+6000;buildBar()}});
addEventListener('pointerdown',e=>{if(!bar.contains(e.target)){const open=performance.now()<barUntil;barUntil=open?0:performance.now()+6000;hudUntil=performance.now()+6000}});
buildBar();
